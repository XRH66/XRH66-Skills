interface:
  display_name: "GPT × 大肥鱼协作"
  short_description: "GPT 规划架构与验收，大肥鱼 CLI 执行；支持跨聊天接管"
  default_prompt: "使用 $delegate-to-deepseek-harness：由 GPT 规划、设计、审查和验收；具体实现优先通过本机 dsh-cli 交给大肥鱼执行，默认完全访问，并保留可接管的 session_id 与 request_id。"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "dsh_harness"
      description: "Existing local DSH Web MCP endpoint used by dsh-cli and native session tools"
      transport: "streamable_http"
      url: "http://127.0.0.1:3080/mcp"

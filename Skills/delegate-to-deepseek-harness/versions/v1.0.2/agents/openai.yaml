interface:
  display_name: "GPT × 大肥鱼协作"
  short_description: "GPT 规划架构与验收，大肥鱼 CLI 执行；支持跨聊天接管"
  default_prompt: "使用 $delegate-to-deepseek-harness：工程实现按 GPT 方案通过本机 dsh-cli 交给大肥鱼，GPT 独立审查和验收；研究及探索性验证由 GPT 主导，较大或重复性实验可委派。当前任务明确指定其他分工时从其要求；保留可接管的 session_id 与 request_id。"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "dsh_harness"
      description: "Existing local DSH Web MCP endpoint used by dsh-cli and native session tools"
      transport: "streamable_http"
      url: "http://127.0.0.1:3080/mcp"
